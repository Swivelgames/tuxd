[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

# Keep release tooling dependencies out of the application lockfile/package.
[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
toml_edit = "0.25"
