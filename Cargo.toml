[package]
name = "tuxd"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Design styled terminal text with live ANSI output"
license = "GPL-3.0-only"
repository = "https://gitlab.com/swivel/tux-design"
readme = "README.md"

[dependencies]
base64 = "0.22.1"
crossterm = { version = "0.29", features = ["serde"] }
libc = "0.2.191"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
ratatui-explorer = "0.3.0"
ratatui-which-key = "=0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
unicode-segmentation = "1.13"
unicode-width = "0.2"
