[package]
name = "tuxd"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "A visual terminal text editor with live ANSI preview, RGB colors, and raw/escaped ANSI import and export"
license = "GPL-3.0-only"
repository = "https://github.com/swivelgames/tuxd"
documentation = "https://github.com/swivelgames/tuxd/tree/main/docs"
readme = "README.md"
keywords = ["ansi", "terminal", "tui", "editor", "ratatui"]
categories = ["command-line-utilities", "text-editors"]
publish = ["crates-io"]
include = [
	"/src/**",
	"/tests/**",
	"/examples/**",
	"/docs/**",
	"/licenses/**",
	"/Cargo.toml",
	"/Cargo.lock",
	"/LICENSE",
	"/*.md",
	"/rustfmt.toml",
]

[dependencies]
base64 = "0.22.1"
# The poll-based Unix backend keeps large mouse bursts from stalling on tty readiness.
crossterm = { version = "0.29", features = ["serde", "use-dev-tty"] }
libc = "0.2.191"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
ratatui-explorer = "0.3.0"
ratatui-which-key = "=0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
unicode-segmentation = "1.13"
unicode-width = "0.2"
