[package]
name = "terminal-ux-designer"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A small terminal editor for designing styled text"

[dependencies]
crossterm = "0.29"
libc = "0.2.191"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
ratatui-explorer = "0.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
unicode-segmentation = "1.13"
unicode-width = "0.2"
